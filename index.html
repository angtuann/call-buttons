<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Call</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #fff;
    }

    .wrap {
      width: 90%;
      max-width: 380px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 12px;
      box-sizing: border-box;
    }

    .buttons {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    a {
      padding: 10px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      color: white;
      font-size: 15px;
      white-space: nowrap;
    }

    .phone { background:#34a853; }
    .facetime { background:#0b8043; }

    /* Tự co kích thước khi cửa sổ nhỏ */
    @media (max-width: 360px) {
      a {
        padding: 8px 14px;
        font-size: 13px;
      }
      input {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <input id="phone" type="text"
           placeholder="Nhập số"
           autocomplete="off"
           oninput="render(this.value)" />

    <div id="buttons" class="buttons"></div>
  </div>

  <script>
    function normalizeNumber(num) {
      num = (num || "").trim();
      if (!num) return "";

      if (num.startsWith("+")) return num;
      if (/^0\d{9}$/.test(num)) return "+84" + num.slice(1);
      if (/^0\d{10,}$/.test(num)) return "+" + num.slice(1);
      return num;
    }

    function render(raw) {
      var box = document.getElementById("buttons");
      var normalized = normalizeNumber(raw);
      if (!normalized) {
        box.innerHTML = "";
        return;
      }

      box.innerHTML = "";

      function link(text, href, cls) {
        var a = document.createElement("a");
        a.className = cls;
        a.href = href;
        a.textContent = text;
        box.appendChild(a);
      }

      link("Phone", "tel:" + normalized, "phone");
      link("FaceTime", "facetime-audio:" + normalized, "facetime");
    }
  </script>

</body>
</html>
